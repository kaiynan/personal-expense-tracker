name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (lint & format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest
        run: |
          pytest

      - name: Run Alembic migrations on empty SQLite database
        run: |
          mkdir -p data
          rm -f data/ci_empty.db
          DB_PATH=data/ci_empty.db alembic upgrade head
          DB_PATH=data/ci_empty.db alembic check
