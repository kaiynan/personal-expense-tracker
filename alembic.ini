[alembic]
# Lokasi skrip migrasi (relatif terhadap root proyek).
script_location = alembic

# Agar `import config` dan `import models` bekerja saat memakai CLI alembic.
prepend_sys_path = .
path_separator = os

file_template = %%(rev)s_%%(slug)s

# URL database sengaja tidak ditulis di sini: env.py membacanya dari config.py
# (atau dari database/migrate.py saat dipanggil lewat kode).
