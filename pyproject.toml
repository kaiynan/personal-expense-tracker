[project]
name = "personal-expense-tracker"
version = "0.1.0"
description = "Personal Expense Tracker"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0,<23.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "matplotlib>=3.10",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "bot",
    "charts",
    "cli",
    "config",
    "database",
    "models",
    "reports",
    "services",
    "utils",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
