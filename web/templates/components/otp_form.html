<div class="space-y-6">
  <div class="text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <h2 class="text-xl font-bold text-slate-900 dark:text-white">Verifikasi Kode OTP</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
      Kode 6 digit telah dikirimkan ke Telegram ID <span class="font-semibold text-slate-800 dark:text-slate-200">{{ telegram_id }}</span>.
    </p>
  </div>

  {% if error %}
  <div class="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-sm flex items-center gap-2">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form hx-post="/auth/verify-otp" hx-target="#auth-card" hx-swap="innerHTML" class="space-y-4">
    <input type="hidden" name="user_id" value="{{ user_id }}">
    <input type="hidden" name="telegram_id" value="{{ telegram_id }}">

    <div>
      <label for="otp-code" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 text-center">
        Masukkan 6 Digit Angka
      </label>
      <input
        type="text"
        id="otp-code"
        name="code"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="••••••"
        autocomplete="one-time-code"
        autofocus
        required
        class="w-full text-center tracking-[0.5em] text-2xl font-bold font-mono py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 shadow-sm transition-all"
      />
      <p class="text-xs text-center text-slate-400 dark:text-slate-500 mt-1.5">
        Berlaku selama 5 menit
      </p>
    </div>

    <button
      type="submit"
      class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 shadow-md shadow-emerald-600/20 transition-all cursor-pointer"
    >
      <span>Verifikasi & Masuk</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </button>
  </form>

  <div class="pt-2 text-center">
    <button
      type="button"
      hx-get="/login"
      hx-target="body"
      class="text-xs font-medium text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-400 transition-colors inline-flex items-center gap-1 cursor-pointer"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      <span>Ganti ID Telegram / Kirim Ulang</span>
    </button>
  </div>
</div>

{% include "components/toast.html" %}
