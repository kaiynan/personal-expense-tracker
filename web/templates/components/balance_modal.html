<!-- Modal Saldo Awal & Koreksi Saldo (Fase W3) -->
<div id="balance-modal" class="fixed inset-0 z-50 flex flex-col justify-end md:justify-center md:items-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-200">
  <!-- Backdrop Click Area -->
  <div class="fixed inset-0 -z-10" onclick="closeBalanceModal()"></div>

  <!-- Modal Card -->
  <div class="bg-white dark:bg-slate-900 rounded-t-3xl md:rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
        </div>
        <h3 class="font-bold text-lg text-slate-900 dark:text-white">Pengaturan Saldo</h3>
      </div>
      <button type="button" onclick="closeBalanceModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 2 Tabs: Saldo Awal | Koreksi Saldo -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/40 px-4 pt-2 gap-2 flex-shrink-0">
      <button type="button" onclick="switchBalTab('opening')" id="bal-tab-btn-opening" class="px-4 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-indigo-600 text-indigo-700 dark:text-indigo-400 bg-white dark:bg-slate-900">
        🏦 Saldo Awal
      </button>
      <button type="button" onclick="switchBalTab('adjust')" id="bal-tab-btn-adjust" class="px-4 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
        ⚖️ Koreksi Saldo
      </button>
    </div>

    <!-- Tab Contents -->
    <div class="p-6 overflow-y-auto flex-1">
      <!-- 1. TAB SALDO AWAL -->
      <form id="bal-form-opening" hx-post="/balances/opening" hx-target="#toast-container" hx-swap="beforeend" class="space-y-4">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Atur saldo awal metode pembayaran beserta tanggal berlakunya. Transaksi sebelum tanggal ini tidak akan dihitung dalam mutasi saldo.
        </p>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Metode Pembayaran</label>
          <select name="method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            {% for m in methods %}
            <option value="{{ m.method_id }}">{{ m.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Saldo Awal (Rp)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400">Rp</span>
            <input type="text" name="amount" required class="rupiah-input w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold text-base focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal Berlaku (DD-MM-YYYY)</label>
          <input type="text" name="effective_date" value="{{ today_str }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="DD-MM-YYYY">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
            Simpan Saldo Awal
          </button>
        </div>
      </form>

      <!-- 2. TAB KOREKSI SALDO -->
      <form id="bal-form-adjust" hx-post="/balances/adjust" hx-target="#toast-container" hx-swap="beforeend" class="space-y-4 hidden">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Masukkan saldo sebenarnya per tanggal koreksi. Sistem akan membuat transaksi koreksi sebesar selisihnya secara otomatis.
        </p>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Metode Pembayaran</label>
          <select name="method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            {% for m in methods %}
            <option value="{{ m.method_id }}">{{ m.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Saldo Sebenarnya (Rp)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400">Rp</span>
            <input type="text" name="actual_balance" required class="rupiah-input w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold text-base focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal Koreksi (DD-MM-YYYY)</label>
          <input type="text" name="date" value="{{ today_str }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="DD-MM-YYYY">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Keterangan (Opsional)</label>
          <input type="text" name="note" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Misal: Penyesuaian uang fisik dompet">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
            Simpan Koreksi Saldo
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function switchBalTab(activeTab) {
    const tabs = ['opening', 'adjust'];
    tabs.forEach(t => {
      const btn = document.getElementById('bal-tab-btn-' + t);
      const form = document.getElementById('bal-form-' + t);
      if (t === activeTab) {
        btn.classList.add('border-indigo-600', 'text-indigo-700', 'dark:text-indigo-400', 'bg-white', 'dark:bg-slate-900');
        btn.classList.remove('border-transparent', 'text-slate-500');
        form.classList.remove('hidden');
      } else {
        btn.classList.remove('border-indigo-600', 'text-indigo-700', 'dark:text-indigo-400', 'bg-white', 'dark:bg-slate-900');
        btn.classList.add('border-transparent', 'text-slate-500');
        form.classList.add('hidden');
      }
    });
  }
</script>
