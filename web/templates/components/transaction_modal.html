<!-- Modal / Bottom Sheet Catat Transaksi (+) (Fase W3) -->
<div id="transaction-modal" class="fixed inset-0 z-50 flex flex-col justify-end md:justify-center md:items-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-200">
  <!-- Backdrop Click Area -->
  <div class="fixed inset-0 -z-10" onclick="closeTransactionModal()"></div>

  <!-- Modal Card / Drawer Body -->
  <div class="bg-white dark:bg-slate-900 rounded-t-3xl md:rounded-2xl max-w-lg w-full max-h-[92vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden transform transition-transform">
    <!-- Header Modal -->
    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-600/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </div>
        <h3 class="font-bold text-lg text-slate-900 dark:text-white">Catat Transaksi</h3>
      </div>
      <button type="button" onclick="closeTransactionModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 4 Tabs Navigasi: Pengeluaran | Pemasukan | Transfer | Input Cepat -->
    <div class="flex border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/40 px-3 pt-2 gap-1 overflow-x-auto flex-shrink-0">
      <button type="button" onclick="switchTxTab('expense')" id="tx-tab-btn-expense" class="px-3.5 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-emerald-600 text-emerald-700 dark:text-emerald-400 bg-white dark:bg-slate-900">
        💸 Pengeluaran
      </button>
      <button type="button" onclick="switchTxTab('income')" id="tx-tab-btn-income" class="px-3.5 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
        💰 Pemasukan
      </button>
      <button type="button" onclick="switchTxTab('transfer')" id="tx-tab-btn-transfer" class="px-3.5 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
        ⇄ Transfer
      </button>
      <button type="button" onclick="switchTxTab('quick')" id="tx-tab-btn-quick" class="px-3.5 py-2 font-semibold text-xs rounded-t-lg transition-colors border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
        ⚡ Cepat
      </button>
    </div>

    <!-- Tab Contents Container -->
    <div class="p-6 overflow-y-auto flex-1">
      <!-- 1. TAB PENGELUARAN -->
      <form id="tx-form-expense" hx-post="/transactions/expense" hx-target="#toast-container" hx-swap="beforeend" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nominal (Rp)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400">Rp</span>
            <input type="text" name="amount" required class="rupiah-input w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold text-base focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Kategori</label>
            <select name="category_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              {% for c in expense_categories %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Metode Pembayaran</label>
            <select name="method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              {% for m in methods %}
              <option value="{{ m.method_id }}">{{ m.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal (DD-MM-YYYY)</label>
            <input type="text" name="date" value="{{ today_str }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="DD-MM-YYYY">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Keterangan (Opsional)</label>
            <input type="text" name="note" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Misal: Makan Siang">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-rose-600 hover:bg-rose-700 dark:bg-rose-500 dark:hover:bg-rose-600 shadow-lg shadow-rose-600/30 transition-all cursor-pointer">
            Simpan Pengeluaran
          </button>
        </div>
      </form>

      <!-- 2. TAB PEMASUKAN -->
      <form id="tx-form-income" hx-post="/transactions/income" hx-target="#toast-container" hx-swap="beforeend" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nominal (Rp)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400">Rp</span>
            <input type="text" name="amount" required class="rupiah-input w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold text-base focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="0">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Kategori</label>
            <select name="category_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              {% for c in income_categories %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Metode Pembayaran</label>
            <select name="method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              {% for m in methods %}
              <option value="{{ m.method_id }}">{{ m.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal (DD-MM-YYYY)</label>
            <input type="text" name="date" value="{{ today_str }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="DD-MM-YYYY">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Keterangan (Opsional)</label>
            <input type="text" name="note" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Misal: Gaji Bulanan">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-600 shadow-lg shadow-emerald-600/30 transition-all cursor-pointer">
            Simpan Pemasukan
          </button>
        </div>
      </form>

      <!-- 3. TAB TRANSFER -->
      <form id="tx-form-transfer" hx-post="/transactions/transfer" hx-target="#toast-container" hx-swap="beforeend" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Nominal Transfer (Rp)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400">Rp</span>
            <input type="text" name="amount" required class="rupiah-input w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-semibold text-base focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Dari Metode</label>
            <select name="from_method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              {% for m in methods %}
              <option value="{{ m.method_id }}">{{ m.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Ke Metode</label>
            <select name="to_method_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              {% for m in methods %}
              <option value="{{ m.method_id }}">{{ m.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Biaya Admin (Opsional)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center font-bold text-slate-400 text-xs">Rp</span>
              <input type="text" name="admin_fee" class="rupiah-input w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal (DD-MM-YYYY)</label>
            <input type="text" name="date" value="{{ today_str }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="DD-MM-YYYY">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Keterangan (Opsional)</label>
          <input type="text" name="note" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Misal: Tarik tunai / Top up">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 shadow-lg shadow-blue-600/30 transition-all cursor-pointer">
            Simpan Transfer
          </button>
        </div>
      </form>

      <!-- 4. TAB INPUT CEPAT -->
      <div id="tx-form-quick" class="space-y-4 hidden">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Ketik transaksi dalam satu kalimat singkat, contoh: <code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-mono text-emerald-600 dark:text-emerald-400">makan 25000 gopay</code> atau <code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-mono text-emerald-600 dark:text-emerald-400">gaji 5000000 bca</code>
        </p>

        <form hx-post="/quick-action/preview" hx-target="#modal-quick-preview-container" class="flex gap-2">
          <input type="text" name="text" required placeholder="makan 25000 gopay" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl transition-all cursor-pointer">
            Urai
          </button>
        </form>

        <div id="modal-quick-preview-container"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function switchTxTab(activeTab) {
    const tabs = ['expense', 'income', 'transfer', 'quick'];
    tabs.forEach(t => {
      const btn = document.getElementById('tx-tab-btn-' + t);
      const form = document.getElementById('tx-form-' + t);
      if (t === activeTab) {
        btn.classList.add('border-emerald-600', 'text-emerald-700', 'dark:text-emerald-400', 'bg-white', 'dark:bg-slate-900');
        btn.classList.remove('border-transparent', 'text-slate-500');
        form.classList.remove('hidden');
      } else {
        btn.classList.remove('border-emerald-600', 'text-emerald-700', 'dark:text-emerald-400', 'bg-white', 'dark:bg-slate-900');
        btn.classList.add('border-transparent', 'text-slate-500');
        form.classList.add('hidden');
      }
    });
  }
</script>
