{% set toast_list = toasts if toasts is defined and toasts else ([toast] if toast is defined and toast else []) %}
{% if toast_list %}
<div id="toast-container" hx-swap-oob="beforeend">
  {% for t in toast_list %}
  <div class="pointer-events-auto flex items-start gap-3 w-full p-4 rounded-xl shadow-lg border transition-all duration-300 transform translate-y-0
    {% if t.type == 'success' %}
      bg-emerald-50 dark:bg-emerald-950/90 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-100
    {% elif t.type == 'warning' %}
      bg-amber-50 dark:bg-amber-950/90 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-100
    {% else %}
      bg-rose-50 dark:bg-rose-950/90 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-100
    {% endif %}"
    {% if t.type == 'success' %}data-auto-dismiss="3000"{% endif %}>
    
    <div class="flex-shrink-0 mt-0.5">
      {% if t.type == 'success' %}
        <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {% elif t.type == 'warning' %}
        <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      {% else %}
        <svg class="w-5 h-5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {% endif %}
    </div>

    <div class="flex-1 text-sm font-medium">
      {{ t.message }}
    </div>

    <button type="button" onclick="this.closest('[data-auto-dismiss], .pointer-events-auto').remove()" class="flex-shrink-0 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1">
      <span class="sr-only">Tutup</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
